[package]
name = "xkjd-dict"
version = "0.1.0"
edition = "2024"
description = "Lossless local Rime dictionary maintenance and evidence-aware Jiandao auditing"
license = "MIT"
include = ["/src/*.rs", "/tests/*.rs", "/examples/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "2"
tempfile = "3"
unicode-normalization = "0.1"
